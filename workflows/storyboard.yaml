# Default end-to-end workflow: text brief -> storyboard plan -> rendered
# scene images (quality-gated) -> animated clips -> one assembled video.
#
# Shape: many inputs (1 brief + optional reference images) -> 1 output video.

name: storyboard
description: Turn a text brief into a short assembled video via plan/render/critique/animate.

inputs:
  mode: flat
  expects:
    text: { min: 1, max: 1 }     # the brief
    image: { min: 0, max: 8 }    # optional style references

steps:
  - id: plan
    kind: text
    provider: anthropic
    model: claude-fable-5
    inputs: ["inputs.image"]     # reference images are shown to the planner
    output: json
    prompt: |
      You are planning a short video. Brief:

      {{ inputs.text[0].content }}

      If reference images are attached, treat them as the visual ground truth
      for subject, palette, and mood — write image_prompts consistent with
      them, and reuse the exact same noun for any subject that recurs across
      scenes (never alternate synonyms for the same thing).

      Produce a storyboard as JSON matching the required schema: 2-6 scenes.

      Each image_prompt goes to Seedream (text-to-image). Write it as concise
      natural-language sentences — subject + action + environment — under 120
      words; open by stating the application scenario (e.g. "Cinematic film
      still: ..."); include style, lighting and composition descriptors; put
      any text that must appear in the image in double quotes; name colors as
      hex plus a color name when palette matters. State the desired scene
      positively rather than listing what to avoid.

      Each motion_prompt goes to Kling (image-to-video), which already has the
      rendered scene as its input frame. Describe ONLY the motion in 15-40
      words: name the main subject just enough to bind it, give it one
      physically plausible movement, and use at most ONE slow camera move with
      an explicit endpoint ("...then the camera settles") — or state "the
      camera remains fixed" and let the subject move. End with: "No morphing,
      no warping, no scene change."

      Each scene needs a whole-number duration in seconds (3-10; prefer 5-7).
      Reply with ONLY the JSON object.
    json_schema:
      type: object
      required: [title, scenes]
      properties:
        title: { type: string }
        scenes:
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: object
            required: [description, image_prompt, motion_prompt, duration_s]
            properties:
              description: { type: string }
              image_prompt: { type: string }
              motion_prompt: { type: string }
              duration_s: { type: number, minimum: 3, maximum: 10 }

  - id: render
    kind: image
    provider: fal-seedream           # Seedream V4 via fal.ai ($0.03/image);
    model: fal-ai/bytedance/seedream/v4/text-to-image
    # swap back to ark-seedream + seedream-5-0-lite-260128 if you have
    # BytePlus/Volcano Ark access
    inputs: ["inputs.image"]     # refs make renders style-consistent (edit mode)
    for_each: plan.scenes
    expected_items: 4            # dry-run fan-out estimate before plan exists
    prompt: "{{ item.image_prompt }}"
    params: { image_size: auto_2K }   # small detail collapses at 1K
    output: file
    quality_gate:
      provider: anthropic
      model: claude-fable-5
      threshold: 0.6
      max_retries: 2
      prompt: |
        You are reviewing a generated image (attached) against the request
        that produced it.

        Request: {{ item.image_prompt }}

        First describe what the image actually shows — subjects, setting,
        lighting, composition — citing only what you can see. If the request
        includes text in double quotes, transcribe any rendered text exactly
        as it appears, including errors; misspelled, duplicated or garbled
        text scores below 0.5.

        Then score how well the image matches the request from 0 to 1. If
        below threshold, write feedback as ONE directional instruction naming
        the specific defect to fix and what to keep (it is fed back to the
        image model verbatim).
        Reply with ONLY JSON: {"score": <0-1>, "feedback": "<text>"}

  - id: animate
    kind: video
    provider: kling
    model: kling-3.0
    for_each: plan.scenes
    expected_items: 4
    prompt: "{{ item.motion_prompt }}"
    inputs: ["render[{index}]"]  # {index} pairs each scene with its image
    params:
      duration_s: "{{ item.duration_s }}"
    output: file

  - id: assemble
    kind: assemble
    provider: ffmpeg
    model: ffmpeg
    inputs: ["animate"]          # all clips, in scene order
    output: file
